<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-Calculator | Cyber Admin Control</title>
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: rgba(10, 20, 35, 0.85);
            --border-color: #00f2fe25;
            --accent-blue: #00f2fe;
            --accent-green: #00ff87;
            --text-main: #e0fbfc;
            --text-muted: #8892b0;
            --danger: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, #020408 0%, #081225 50%, #031b14 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px;
        }

        /* Auth Screen Styling */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-box {
            background: rgba(10, 20, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 30px rgba(0, 242, 254, 0.15);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .auth-box h2 {
            margin-bottom: 20px;
            color: var(--accent-blue);
            font-size: 1.5rem;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .auth-box input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .auth-box button:hover {
            background: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.5);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 242, 254, 0.2);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .badge-system {
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 135, 0.2);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 135, 0.05);
        }

        th {
            background: rgba(0, 242, 254, 0.05);
            color: var(--accent-blue);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        tr:hover {
            background: rgba(0, 242, 254, 0.02);
        }

        .user-meta span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .plan-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .screenshot-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .screenshot-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 165, 2, 0.15);
            color: #ffa502;
            border: 1px solid rgba(255, 165, 2, 0.3);
        }

        .status-approved {
            background: rgba(0, 255, 135, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 135, 0.3);
        }

        .status-denied {
            background: rgba(255, 71, 87, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .status-blocked {
            background: rgba(255, 71, 87, 0.25);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-approve {
            background: rgba(0, 255, 135, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .btn-approve:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 135, 0.5);
        }

        .btn-deny {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-deny:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .btn-block {
            background: rgba(255, 71, 87, 0.3);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-block:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .btn-unblock {
            background: rgba(0, 242, 254, 0.2);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .btn-unblock:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* Glass Modal for Full Screenshot View */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content-wrapper {
            position: relative;
            background: rgba(10, 20, 35, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 30px rgba(0, 242, 254, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 85vw;
            max-height: 85vh;
            border: 1px solid var(--accent-blue);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .modal-close {
            position: absolute;
            top: -15px; right: -15px;
            background: rgba(10, 20, 35, 0.9);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            width: 35px; height: 35px;
            border-radius: 50%;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--accent-blue);
            color: #000;
        }

        /* Glass Toast Notification Styling */
        #toastContainer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .glass-toast {
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px rgba(0, 242, 254, 0.15);
            font-size: 0.9rem;
            min-width: 280px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }

        .glass-toast.success {
            border-color: rgba(0, 255, 135, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px rgba(0, 255, 135, 0.15);
        }

        .glass-toast.error {
            border-color: rgba(255, 71, 87, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px rgba(255, 71, 87, 0.15);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>

<!-- Authentication Overlay -->
<div id="authOverlay">
    <div class="auth-box">
        <h2>Admin Authentication</h2>
        <input type="password" id="authPassword" placeholder="Enter Admin Password">
        <button onclick="verifyPassword()">Access Panel</button>
        <div id="authError" class="error-msg">Incorrect Password. Access Denied.</div>
    </div>
</div>

<div class="container">
    <header>
        <h1>P-Calculator // Cyber Admin</h1>
        <div class="badge-system">SECURE LINK ACTIVE</div>
    </header>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>User Profile</th>
                    <th>Selected Plan</th>
                    <th>Amount</th>
                    <th>Payment Proof</th>
                    <th>Life Tracking Progress</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="paymentTableBody">
                <!-- Dynamically injected rows sorted from newest to oldest -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal View with Glass Container -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-content-wrapper" onclick="event.stopPropagation()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="" alt="Enlarged Payment Proof">
    </div>
</div>

<!-- Toast Notifications Container -->
<div id="toastContainer"></div>

<!-- Notification Sound (Embedded Web Audio API beep generator so no external assets are required) -->
<script>
    function playNotificationSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5 note
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } catch(e) {
            console.log('Audio playback blocked or unsupported', e);
        }
    }

    // Custom Glass Toast Notification Function replacing standard alerts
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `glass-toast ${type}`;
        toast.innerHTML = `<span>${message}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 3000);
    }
</script>

<script>
    // FIXED: Use relative API path instead of hardcoded localhost
    const API_URL = '/api/admin/payments';
    let previousLatestId = null;

    // Check persistent authentication state via sessionStorage on load
    window.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('admin_authenticated') === 'true') {
            document.getElementById('authOverlay').style.display = 'none';
            fetchPayments(true); // Initial load without sound trigger
            startPolling();
        }
    });

    function verifyPassword() {
        const pwdInput = document.getElementById('authPassword').value;
        if (pwdInput === '@Pepsi2026On') {
            sessionStorage.setItem('admin_authenticated', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            fetchPayments(true);
            startPolling();
        } else {
            document.getElementById('authError').style.display = 'block';
        }
    }

    // Allow pressing "Enter" to submit password
    document.getElementById('authPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            verifyPassword();
        }
    });

    async function fetchPayments(isInitial = false) {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();
            
            if (result.success) {
                const tableBody = document.getElementById('paymentTableBody');
                tableBody.innerHTML = '';
                
                // Sort records from newest to oldest based on date/timestamp
                const sortedPayments = result.data.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                if (sortedPayments.length > 0) {
                    const latestId = sortedPayments[0].id;
                    
                    // Detect if a new record / screenshot has arrived
                    if (!isInitial && previousLatestId !== null && latestId !== previousLatestId) {
                        playNotificationSound();
                        showToast('New payment screenshot received!', 'success');
                    }
                    
                    previousLatestId = latestId;
                }

                // FIXED: Removed invalid logical operator check and used standard forEach
                sortedPayments.forEach(payment => {
                    const row = document.createElement('tr');
                    const formattedDate = new Date(payment.date).toLocaleString();

                    // Calculate lifecycle progress and remaining days
                    const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
                    const startTime = payment.lifecycleStart ? parseInt(payment.lifecycleStart, 10) : new Date(payment.date).getTime();
                    const elapsedTime = Date.now() - startTime;
                    const remainingTimeMs = thirtyDaysMs - elapsedTime;
                    const daysLeft = Math.max(0, Math.ceil(remainingTimeMs / (1000 * 60 * 60 * 24)));
                    const progressPercent = Math.min(100, Math.max(0, Math.round((elapsedTime / thirtyDaysMs) * 100)));

                    const isBlocked = payment.status === 'Blocked';

                    row.innerHTML = `
                        <td><span style="font-size: 0.85rem; color: var(--text-muted);">${formattedDate}</span></td>
                        <td class="user-meta">
                            <strong>${payment.user}</strong>
                            <span>ID: #${payment.id}</span>
                        </td>
                        <td><span class="plan-tag">${payment.plan || 'Pro Physics/Chem'}</span></td>
                        <td style="font-weight: bold; color: var(--accent-blue);">${payment.amount}</td>
                        <td>
                            <img src="${payment.screenshot || 'https://via.placeholder.com/150?text=No+Proof'}" 
                                 class="screenshot-thumb" 
                                 onclick="openModal(this.src)" 
                                 alt="Proof">
                        </td>
                        <td>
                            <div style="font-size: 0.8rem; margin-bottom: 4px;">${daysLeft} days left (${progressPercent}%)</div>
                            <div style="width: 100px; background: rgba(255,255,255,0.1); border-radius: 4px; height: 6px; overflow:hidden;">
                                <div style="width: ${progressPercent}%; background: ${progressPercent > 85 ? 'var(--danger)' : 'var(--accent-blue)'}; height: 100%;"></div>
                            </div>
                        </td>
                        <td>
                            <span class="status-badge status-${payment.status.toLowerCase()}">${payment.status}</span>
                        </td>
                        <td>
                            <div class="actions">
                                ${payment.status === 'Pending' ? `
                                    <button class="btn-approve" onclick="updateStatus(${payment.id}, 'Approved')">Approve</button>
                                    <button class="btn-deny" onclick="updateStatus(${payment.id}, 'Denied')">Deny</button>
                                ` : ''}
                                ${!isBlocked ? `
                                    <button class="btn-block" onclick="updateStatus(${payment.id}, 'Blocked')">Block</button>
                                ` : `
                                    <button class="btn-unblock" onclick="updateStatus(${payment.id}, 'Approved')">Unblock</button>
                                `}
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        } catch (error) {
            console.error('Error fetching admin data:', error);
        }
    }

    // Live polling every 5 seconds so user doesn't need to manually refresh
    function startPolling() {
        setInterval(() => {
            fetchPayments(false);
        }, 5000);
    }

    async function updateStatus(id, status) {
        try {
            // FIXED: Use relative API route for updating status
            const response = await fetch(`/api/admin/payments/${id}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const result = await response.json();
            
            if (result.success) {
                fetchPayments(true);
                showToast(`Payment successfully ${status.toLowerCase()}!`, status === 'Approved' ? 'success' : 'error');
            } else {
                showToast('Action failed.', 'error');
            }
        } catch (error) {
            console.error('Error updating status:', error);
            showToast('Network error communicating with the server.', 'error');
        }
    }

    function openModal(src) {
        document.getElementById('modalImage').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>

</body>
</html>
